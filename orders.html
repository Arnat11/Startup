<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>รายการออเดอร์ | MALI BLEND</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{font-family:Prompt,sans-serif;color:#263b2d;background:#fff9ef;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.wrap{width:min(1000px,calc(100% - 32px));margin:38px auto}.head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.eyebrow{color:#3c784b;font-size:.82rem}h1{margin:2px 0;font-size:clamp(1.7rem,4vw,2.4rem)}p{margin:0;color:#778175}.tools{display:flex;gap:10px;align-items:center}.button{font:inherit;border:1px solid #dce7d9;border-radius:999px;padding:10px 16px;background:white;color:#285b39;cursor:pointer}.button.primary{background:#3c784b;color:white;border-color:#3c784b}.panel{padding:20px;border:1px solid #eee8dc;border-radius:18px;background:#fffdf8}.login{display:flex;gap:10px;max-width:600px}.login input{flex:1;min-width:0;border:1px solid #ddd8cd;border-radius:10px;padding:11px;font:inherit}.orders{display:grid;gap:14px;margin-top:18px}.order{padding:18px;border:1px solid #eee8dc;border-radius:16px;background:white}.order-top{display:flex;justify-content:space-between;gap:12px;align-items:start}.order h2{margin:0;font-size:1.08rem}.order time{color:#8a9185;font-size:.8rem}.order-meta{margin:3px 0 12px}.items{margin:0;padding-left:20px}.items li{padding:2px 0}.order-bottom{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid #f0eee8}.status{font:inherit;border:1px solid #dce7d9;border-radius:9px;padding:7px;background:#fff}.error{color:#a53535;margin-top:12px}.empty{text-align:center;padding:38px;color:#778175}.hint{margin:0 0 12px;font-size:.85rem}@media(max-width:600px){.head{align-items:flex-start;flex-direction:column}.tools{width:100%;justify-content:space-between}.login{flex-direction:column}.order-top,.order-bottom{align-items:flex-start;flex-direction:column}}
    </style>
</head>
<body>
    <main class="wrap">
        <header class="head"><div><span class="eyebrow">MALI BLEND · SHOP</span><h1>รายการออเดอร์</h1><p>ออเดอร์ใหม่จะแสดงที่หน้านี้โดยอัตโนมัติ</p></div><div class="tools"><a class="button" href="./">กลับหน้าร้าน</a><button class="button" id="refresh" type="button">รีเฟรช</button></div></header>
        <section class="panel" id="loginPanel"><p class="hint">ใส่รหัสผู้ดูแลที่แสดงในหน้าต่าง Terminal ตอนเปิดเซิร์ฟเวอร์</p><form class="login" id="loginForm"><input id="adminKey" type="password" autocomplete="current-password" placeholder="รหัสผู้ดูแล" required><button class="button primary" type="submit">เปิดรายการออเดอร์</button></form><p class="error" id="error" hidden></p></section>
        <section class="orders" id="orders" aria-live="polite"></section>
    </main>
    <script>
        const keyInput=document.querySelector('#adminKey'), loginPanel=document.querySelector('#loginPanel'), errorBox=document.querySelector('#error'), ordersBox=document.querySelector('#orders');
        let adminKey=sessionStorage.getItem('maliShopAdminKey')||'';
        const statuses=['ใหม่','กำลังทำ','พร้อมรับ','เสร็จแล้ว','ยกเลิก'];
        const escDate=value=>new Date(value).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'});
        async function request(path,options={}){const response=await fetch(path,{...options,headers:{'Content-Type':'application/json','Authorization':`Bearer ${adminKey}`,...options.headers}});const result=await response.json();if(!response.ok)throw new Error(result.error||'เกิดข้อผิดพลาด');return result}
        function showError(message){errorBox.textContent=message;errorBox.hidden=false}
        async function loadOrders(){if(!adminKey)return;try{const {orders}=await request('/api/orders');loginPanel.hidden=true;ordersBox.replaceChildren();if(!orders.length){const empty=document.createElement('div');empty.className='panel empty';empty.textContent='ยังไม่มีออเดอร์ใหม่';ordersBox.append(empty);return}for(const order of orders){const card=document.createElement('article');card.className='order';const top=document.createElement('div');top.className='order-top';const title=document.createElement('h2');title.textContent=`${order.number} · ${order.customer}`;const time=document.createElement('time');time.textContent=escDate(order.created_at);top.append(title,time);const meta=document.createElement('p');meta.className='order-meta';meta.textContent=`โทร ${order.phone}`;const list=document.createElement('ul');list.className='items';for(const item of order.items){const li=document.createElement('li');const options=[item.style,item.sweetness!==undefined?`หวาน ${item.sweetness}%`:'',item.toppings?.length?`เพิ่ม ${item.toppings.join(', ')}`:''].filter(Boolean).join(' · ');li.textContent=`${item.name}${options?` (${options})`:''} × ${item.quantity} · ฿${item.unitPrice*item.quantity}`;list.append(li)}const bottom=document.createElement('div');bottom.className='order-bottom';const total=document.createElement('strong');total.textContent=`รวม ฿${order.total}`;const select=document.createElement('select');select.className='status';select.setAttribute('aria-label',`เปลี่ยนสถานะ ${order.number}`);for(const value of statuses){const option=document.createElement('option');option.value=value;option.textContent=value;option.selected=value===order.status;select.append(option)}select.addEventListener('change',async()=>{try{await request(`/api/orders/${encodeURIComponent(order.number)}/status`,{method:'PATCH',body:JSON.stringify({status:select.value})})}catch(error){showError(error.message);select.value=order.status}});bottom.append(total,select);card.append(top,meta,list,bottom);ordersBox.append(card)}}catch(error){loginPanel.hidden=false;showError(error.message);if(error.message.includes('รหัสผู้ดูแล')){adminKey='';sessionStorage.removeItem('maliShopAdminKey')}}}
        document.querySelector('#loginForm').addEventListener('submit',async event=>{event.preventDefault();adminKey=keyInput.value;sessionStorage.setItem('maliShopAdminKey',adminKey);errorBox.hidden=true;await loadOrders()});document.querySelector('#refresh').addEventListener('click',loadOrders);if(adminKey){loginPanel.hidden=true;loadOrders()}setInterval(loadOrders,5000);
    </script>
</body>
</html>
